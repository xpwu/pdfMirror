# pdfMirror 本地网关配置（模板，由 start.sh envsubst 填充变量）
# 变量：WORKSPACES_ROOT / WORKSPACES_CN_ROOT / FRONTEND_OUT / NGINX_PORT / BACKEND_PORT

pid       ${ROOT}/tmp/nginx.pid;
error_log ${ROOT}/tmp/nginx.error.log warn;
daemon    off;          # 前台运行，方便 start.sh 接管生命周期

events {
    worker_connections 128;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile     on;
    tcp_nopush   on;
    keepalive_timeout 65;

    # 大文件 / PDF 流式友好
    client_max_body_size 200m;

    server {
        # 只绑 loopback —— 不暴露局域网，单机工具
        listen       127.0.0.1:${NGINX_PORT};
        server_name  localhost;

        # ── 1) 前端静态产物（Next build 的 out/，或 dev 的 .next）──
        root ${FRONTEND_OUT};
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # ── 2) API → Go tinyserver (127.0.0.1:BACKEND_PORT) ──
        # SSE 关键三件套：关缓冲 / 关缓存 / 长连接
        location /api/ {
            proxy_pass         http://127.0.0.1:${BACKEND_PORT}/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;

            proxy_buffering    off;
            proxy_cache        off;
            proxy_request_buffering off;

            # SSE 长超时（翻译可能跑很久）
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── 3) 英文根：PDF 原文（只读，Range 自动支持 → PDF.js 分片）──
        location /files/ {
            alias ${WORKSPACES_ROOT}/;
            add_header Cache-Control "public, max-age=3600";
        }

        # ── 4) 中文根：译文 md / blocks json（不缓存，随时在写）──
        location /translated/ {
            alias ${WORKSPACES_CN_ROOT}/;
            add_header Cache-Control "no-cache";
        }
    }
}